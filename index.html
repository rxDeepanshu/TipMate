<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Calculator</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .calculator {
        width: 350px;
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.45);
      }

      
      h1,h3 {
        text-align: center;
        margin-bottom: 10px;
        background-color: #01448c;
        padding: 15px;
        color: #f2f2f2;
        margin: 0;
      }

      h1 {
        border-radius: 6px 6px 0 0;
        height:70px;
      }
      
      h3 {
        font-weight: 100;
        background-color: #156ece;
        border-radius:0 0 6px 6px;
        height:50px;

      }

      label {
        display: block;
        margin: 12px 0 6px;
        font-weight: 600;
      }

      input,
      select,
      button {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: 2px solid #d8d5d5;
        border-radius: 6px;
      }

      button {
        margin-top: 20px;
        background: #0260c5;
        color: white;
        font-weight:600 ;
        border: none;
        cursor: pointer;
      }

      button:hover {
        background: #01448c;
      }

      .result {
        margin-top: 20px;
        padding: 15px;
        background: #002851;
        color: white;
        border-radius: 8px;
        line-height: 1.8;
        text-align: center;
      }
    </style>
  </head>

  <body>

    <div class="calculator">

      <div class="heading">
        <h1>TipMate</h1>
        <h3>Tip Calculator</h3>
      </div>

      <label for="bill">Bill Amount</label>
      <input type="number" id="bill" placeholder="Enter bill amount" />

      <label for="tip">Tip Percentage</label>
      <select id="tip">
        <option value="5">5%</option>
        <option value="10">10%</option>
        <option value="15" selected>15%</option>
        <option value="20">20%</option>
        <option value="25">25%</option>
      </select>

      <label for="people">Number of People</label>
      <input type="number" id="people" value="1" min="1" />

      <button onclick="calculateTip()">Calculate Tip</button>

      <div class="result" id="result">Enter your bill to calculate.</div>
    </div>

    <script>
      function calculateTip() {
        const bill = Number(document.getElementById("bill").value);
        const tipPercent = Number(document.getElementById("tip").value);
        const people = Number(document.getElementById("people").value);

        if (bill <= 0 || people <= 0) {
          document.getElementById("result").innerHTML =
            "Please enter valid values.";
          return;
        }

        const tipAmount = (bill * tipPercent) / 100;
        const totalAmount = bill + tipAmount;
        const perPerson = totalAmount / people;

        document.getElementById("result").innerHTML = `
        Tip Amount: ₹${tipAmount.toFixed(2)}<br>
        Total Bill: ₹${totalAmount.toFixed(2)}<br>
        Per Person: ₹${perPerson.toFixed(2)}
      `;
      }
    </script>
  </body>
</html>
